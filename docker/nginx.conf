# -----------------------------------------------------------------------------
# nginx.conf — Production Nginx configuration for HeatNote (static SPA)
# -----------------------------------------------------------------------------
# Nginx config is made of "blocks". The two required top-level blocks for a
# basic HTTP server are `events` and `http`.

# events: Controls how Nginx handles connections at the OS level.
# Leaving it empty uses Nginx's built-in defaults (fine for most apps).
events {}

http {
    # mime.types tells Nginx what Content-Type header to send per file extension.
    # Without this, browsers receive all files as "text/plain" and
    # won't execute JS or apply CSS.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression — reduces file sizes transferred over the network.
    # A 100KB JS file becomes ~30KB. Browsers decompress it automatically.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000; # Only compress files larger than 1KB

    server {
        # Listen on port 80 (standard HTTP port inside the container).
        # The host machine maps this to whatever port you choose in docker-compose.
        listen 80;

        # `_` means "match any hostname" — works for localhost, IPs, and domains.
        server_name _;

        # The directory inside the container where Nginx looks for files to serve.
        # This must match the COPY destination in your Dockerfile.
        root /usr/share/nginx/html;

        # Default file to serve when a directory is requested (e.g. visiting /).
        index index.html;

        # -- Main SPA Route ---------------------------------------------------
        location / {
            # try_files is the key directive for Single Page Applications.
            #
            # When a browser requests /some-page, Nginx checks in order:
            #   1. Is there a file at exactly /some-page?  -> serve it
            #   2. Is there a directory at /some-page/?    -> serve its index
            #   3. If neither exists                       -> serve index.html
            #
            # Step 3 is what makes SPAs work. Your JavaScript then reads the URL
            # and renders the correct view. Without this, refreshing any route
            # other than / would return a 404 from Nginx.
            try_files $uri $uri/ /index.html;
        }

        # -- Health Check Endpoint ---------------------------------------------
        # /healthz is a DevOps convention. A dedicated URL that returns 200 OK
        # to prove the server is alive and responding.
        #
        # Used by:
        #   - Docker health checks     (is the container healthy?)
        #   - Kubernetes probes        (should traffic be routed here?)
        #   - Uptime monitoring tools  (is the site up?)
        #   - CI/CD pipelines          (did the deployment succeed?)
        location /healthz {
            access_log off;             # Don't pollute logs with health pings
            return 200 "healthy\n";     # Respond with 200 OK and plain text body
            add_header Content-Type text/plain;
        }
    }
}
