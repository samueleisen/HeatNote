# -----------------------------------------------------------------------------
# nginx.conf — Production Nginx configuration for HeatNote (static SPA)
# -----------------------------------------------------------------------------
# Nginx config is made of "blocks". The two required top-level blocks for a
# basic HTTP server are `events` and `http`.

# events: Controls how Nginx handles connections at the OS level.
# Leaving it empty uses Nginx's built-in defaults (fine for most apps).
events {}

http {
    # mime.types tells Nginx what Content-Type header to send per file extension.
    # Without this, browsers receive all files as "text/plain" and
    # won't execute JS or apply CSS.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression — reduces file sizes transferred over the network.
    # A 100KB JS file becomes ~30KB. Browsers decompress it automatically.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000; # Only compress files larger than 1KB

    server {
        # Listen on port 80 (standard HTTP port inside the container).
        # The host machine maps this to whatever port you choose in docker-compose.
        listen 80;

        # `_` means "match any hostname" — works for localhost, IPs, and domains.
        server_name _;

        # The directory inside the container where Nginx looks for files to serve.
        # This must match the COPY destination in your Dockerfile.
        root /usr/share/nginx/html;

        # Default file to serve when a directory is requested (e.g. visiting /).
        index index.html;

        # -- Main SPA Route ---------------------------------------------------
        location / {
            # try_files is the key directive for Single Page Applications.
            #
            # When a browser requests /some-page, Nginx checks in order:
            #   1. Is there a file at exactly /some-page?  -> serve it
            #   2. Is there a directory at /some-page/?    -> serve its index
            #   3. If neither exists                       -> serve index.html
            #
            # Step 3 is what makes SPAs work. Your JavaScript then reads the URL
            # and renders the correct view. Without this, refreshing any route
            # other than / would return a 404 from Nginx.
            try_files $uri $uri/ /index.html;
        }

        # -- Backend API Proxy ------------------------------------------------
        # All requests to /api/* are forwarded to the backend Node.js container.
        # "backend" is the Docker Compose service name, which Docker DNS resolves
        # to the container's internal IP address automatically.
        #
        # The trailing slash on proxy_pass strips the /api prefix:
        #   Browser requests:  /api/workspaces/2026-10-03
        #   Backend receives:  /workspaces/2026-10-03
        location /api/ {
            proxy_pass         http://backend:3000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Allow large request bodies for workspace saves with many notes.
            client_max_body_size 50m;
        }

        # -- Uploaded Images Proxy --------------------------------------------
        # Serves images that were uploaded via POST /api/upload.
        # The files live inside the backend container's /data/uploads/ volume.
        # Nginx proxies these requests so the browser can load them by URL.
        location /uploads/ {
            proxy_pass         http://backend:3000/uploads/;
            proxy_set_header   Host $host;
        }

        # -- Health Check Endpoint for Docker ----------------------------------
        # /healthz is a DevOps convention. A dedicated URL that returns 200 OK
        # to prove the server is alive and responding.
        #
        # Used by the healthcheck in docker-compose.yml.
        # Docker calls this every 30 seconds. If it fails 3 times in a row,
        # Docker marks the container as unhealthy, and orchestrators can react.
        #
        # access_log off: Don't fill up logs with health check noise.
        # return 200: Immediately respond with 200 OK and a plain text body.
        location /healthz {
            access_log off;
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }
    }
}
