# docker-compose.yml -- Local development launcher for HeatNote
#
# Instead of typing a long docker run command with ports and flags, run:
#   docker compose up           <- builds image (if needed) and starts
#   docker compose up --build   <- forces a rebuild before starting
#   docker compose down         <- stops and removes containers
#   docker compose logs -f      <- stream live container logs

services:
  app:
    # build: look for a Dockerfile in the current directory and build from it
    build: .

    # ports: HOST_PORT:CONTAINER_PORT
    # Container listens on 80 (Nginx). Your machine exposes it on 8080.
    # Visit: http://localhost:8080
    ports:
      - "8080:80"

    # restart: auto-restart on crash or reboot, but not on manual docker compose down
    restart: unless-stopped

    # healthcheck: Docker periodically runs this to verify the container is healthy.
    # Ties into the /healthz location block defined in nginx.conf.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s    # check every 30 seconds
      timeout: 5s      # fail if no response within 5 seconds
      retries: 3       # mark unhealthy after 3 consecutive failures
      start_period: 5s # grace period before first check
