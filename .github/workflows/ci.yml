# =============================================================================
# ci.yml -- CI Pipeline for HeatNote
# =============================================================================
# Runs on every push AND pull request to main.
# Builds the Docker image and scans it with Trivy for CVEs.
#
# NOTE: GHCR push and VPS/SSH deploy steps have been removed.
# HeatNote now runs as a local Docker Compose stack.
# No secrets need to be injected at build time.
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# =============================================================================
# Job: Build & Security Scan
# =============================================================================
jobs:

  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:

      # Step 1: Clone the repo onto the fresh GitHub runner VM.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx -- the modern Docker build engine.
      # Supports multi-platform builds and better layer caching vs the old builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the Docker image.
      # push: false  -> build and load into local Docker daemon only.
      # load: true   -> makes the image available to the next step (Trivy scan).
      # tags         -> github.sha is the full 40-char commit hash.
      #                 Every image is uniquely traceable to the exact code version.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: heatnote:${{ github.sha }}

      # Step 4: Scan the built image for known CVEs using Trivy (Aqua Security).
      # exit-code: 1  -> FAIL the pipeline if vulnerabilities are found.
      #                   This is the security gate -- bad images cannot proceed.
      # severity      -> Only block on CRITICAL or HIGH.
      #                   MEDIUM/LOW are still reported but do not stop deployment.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: heatnote:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
